<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

const emojis = [
  "🙂","😐","😶","😎","😮","😬","🙃","😕",
  "🥲","🤔","😑","😳","😵","😴","😇"
];

const palette = [190, 220, 270, 305, 335, 35, 55, 135];

const points = [];
const TOTAL = 9000;

for (let i = 0; i < TOTAL; i++) {
  const angle = Math.random() * Math.PI * 2;
  const radius = Math.pow(Math.random(), 0.38);

  const x = Math.cos(angle) * radius * 1.55 + (Math.random() - 0.5) * 0.28;
  const y = Math.sin(angle) * radius * 0.95 + (Math.random() - 0.5) * 0.28;

  points.push({
    x,
    y,
    emoji: emojis[Math.floor(Math.random() * emojis.length)],
    hue: palette[Math.floor(Math.random() * palette.length)]
  });
}

let zoom = 0.58;
let offsetX = 0;
let offsetY = 0;

let dragging = false;
let lastX = 0;
let lastY = 0;

canvas.addEventListener("mousedown", e => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener("mouseup", () => dragging = false);

window.addEventListener("mousemove", e => {
  if (!dragging) return;
  offsetX += e.clientX - lastX;
  offsetY += e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
});

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.14 : 0.88);
}, { passive: false });

function zoomAt(mouseX, mouseY, factor) {
  const beforeX = (mouseX - W / 2 - offsetX) / zoom;
  const beforeY = (mouseY - H / 2 - offsetY) / zoom;

  zoom *= factor;
  zoom = Math.max(0.35, Math.min(zoom, 60));

  const afterX = beforeX * zoom;
  const afterY = beforeY * zoom;

  offsetX += mouseX - W / 2 - offsetX - afterX;
  offsetY += mouseY - H / 2 - offsetY - afterY;
}

let lastTouchDistance = null;
let lastTouchX = null;
let lastTouchY = null;

canvas.addEventListener("touchstart", e => {
  e.preventDefault();

  if (e.touches.length === 1) {
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
  }

  if (e.touches.length === 2) {
    lastTouchDistance = getTouchDistance(e);
  }
}, { passive: false });

canvas.addEventListener("touchmove", e => {
  e.preventDefault();

  if (e.touches.length === 1) {
    const x = e.touches[0].clientX;
    const y = e.touches[0].clientY;

    offsetX += x - lastTouchX;
    offsetY += y - lastTouchY;

    lastTouchX = x;
    lastTouchY = y;
  }

  if (e.touches.length === 2) {
    const newDistance = getTouchDistance(e);

    if (lastTouchDistance) {
      const factor = newDistance / lastTouchDistance;

      const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;

      zoomAt(centerX, centerY, factor);
    }

    lastTouchDistance = newDistance;
  }
}, { passive: false });

canvas.addEventListener("touchend", () => {
  lastTouchDistance = null;
  lastTouchX = null;
  lastTouchY = null;
});

function getTouchDistance(e) {
  const dx = e.touches[0].clientX - e.touches[1].clientX;
  const dy = e.touches[0].clientY - e.touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

function draw() {
  ctx.fillStyle = "#050505";
  ctx.fillRect(0, 0, W, H);

  const scale = Math.min(W, H) * 0.42;

  for (const p of points) {
    const sx = W / 2 + offsetX + p.x * scale * zoom;
    const sy = H / 2 + offsetY + p.y * scale * zoom;

    if (sx < -100 || sx > W + 100 || sy < -100 || sy > H + 100) continue;

    if (zoom < 8) {
      ctx.fillStyle = `hsla(${p.hue}, 90%, 62%, 0.85)`;
      ctx.beginPath();
      ctx.arc(sx, sy, Math.max(0.45, zoom * 0.16), 0, Math.PI * 2);
      ctx.fill();
    } else {
      const size = Math.min(38, zoom * 1.25);
      ctx.font = `${size}px serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(p.emoji, sx, sy);
    }
  }

  requestAnimationFrame(draw);
}

draw();
</script>
